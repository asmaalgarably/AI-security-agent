name: Daily AI & Cybersecurity Briefing

on:
  # 1. الجدولة الزمنية: يعمل يومياً الساعة 6:00 صباحاً بتوقيت UTC (8:00 صباحاً بتوقيتكِ المحلي)
  schedule:
    - cron: '0 6 * * *'

  # 2. يتيح لكِ زر تشغيل يدوي داخل GitHub لاختباره في أي وقت
  workflow_dispatch:

jobs:
  run-security-agent:
    runs-on: ubuntu-latest

    steps:
      # سحب ملفات المشروع من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # تثبيت أداة uv السريعة على سيرفر GitHub
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # تثبيت بايثون والمكتبات الموجودة في pyproject.toml و uv.lock
      - name: Install dependencies
        run: uv sync --locked

      # تشغيل الوكيل الذكي في الوضع الإنتاجي التلقائي مع تمرير المفاتيح السرية
      - name: Run AI Security Agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: uv run main.py --auto